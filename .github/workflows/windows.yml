name: Windows EXE
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'assets/**'
      - 'installer/**'
      - 'Beispiel.storynator'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storynator-windows
  cancel-in-progress: true
jobs:
  build:
    name: Build and test Windows executable
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run integration tests on Windows
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q
      - name: Check keyboard navigation and layout at 150 percent scaling
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: 1.5
        run: python -m pytest test_safety.py -q -k "keyboard_navigation_and_small_window or theme_text_contrast_and_focus_names"
      - name: Build application
        run: python scripts/build_windows.py
      - name: Test packaged application
        env:
          QT_QPA_PLATFORM: windows
          STORYNATOR_SMOKE_LOG: smoke-error.txt
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$pwd/dist/Storynator/Storynator.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'EXE startup timed out' }
          if ($process.ExitCode -ne 0) {
            if (Test-Path smoke-error.txt) { Get-Content smoke-error.txt }
            throw "EXE smoke test failed: $($process.ExitCode)"
          }
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup -y --no-progress }
          & $compiler "/DStorynatorVersion=0.8.$env:GITHUB_RUN_NUMBER" installer/Storynator.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Compress-Archive -Path dist/Storynator -DestinationPath dist/Storynator-Portable.zip
      - name: Test Windows installation and file associations
        shell: pwsh
        run: |
          $install = "$env:RUNNER_TEMP/Storynator installed"
          $process = Start-Process dist/Storynator-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installation failed' }
          if (-not (Test-Path "$install/Storynator.exe")) { throw 'Installed EXE missing' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Storynator.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Windows Search shortcut missing' }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne "$install/Storynator.exe".Replace('/','\')) { throw "Shortcut target incorrect: $target" }
          $command = (Get-Item 'HKCU:/Software/Classes/Storynator.Project/shell/open/command').GetValue('')
          if ($command -notlike '*Storynator.exe*"%1"') { throw 'Project association incorrect' }
          $preset = (Get-Item 'HKCU:/Software/Classes/Storynator.Preset/shell/open/command').GetValue('')
          if ($preset -notlike '*--import-preset*') { throw 'Preset association incorrect' }
          $process = Start-Process "$install/Storynator.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed application test failed' }
          $project = Join-Path $install 'UserProject.storynator'
          python -c "import sys; from core import load_project,save_project; save_project(load_project('Beispiel.storynator'),sys.argv[1])" $project
          if ($LASTEXITCODE -ne 0) { throw 'Update fixture failed' }
          $legacyProject = Join-Path $install 'LegacyUserProject.storynator'
          Copy-Item Beispiel.storynator $legacyProject
          $legacyBefore = (Get-FileHash $legacyProject -Algorithm SHA256).Hash
          $before = (Get-FileHash $project -Algorithm SHA256).Hash
          $process = Start-Process dist/Storynator-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/STORYNATORUPDATE=1', "/STORYNATORPROJECT=`"$project`"", "/DIR=`"$install`"") -PassThru
          if (-not $process.WaitForExit(120000)) { throw 'In-place installer timed out' }
          if ($process.ExitCode -ne 0) { throw 'In-place upgrade failed' }
          $env:PYTHONIOENCODING = 'utf-8'
          $expectedName = (python -c "import sys; from core import load_project; print(load_project(sys.argv[1])['name'])" $project).Trim()
          $restarted = $null
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $restarted = Get-Process -Name Storynator -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$install/Storynator.exe".Replace('/','\') } | Where-Object { $_.Refresh(); $_.MainWindowTitle.StartsWith($expectedName) } | Select-Object -First 1
            if ($restarted) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $restarted -or -not $restarted.MainWindowTitle.StartsWith($expectedName)) { throw 'Update did not reopen the project' }
          if (-not $restarted.CloseMainWindow()) { throw 'Updated application has no window' }
          if (-not $restarted.WaitForExit(30000)) { throw 'Updated application failed to close' }
          if ((Get-FileHash $project -Algorithm SHA256).Hash -ne $before) { throw 'Upgrade changed the user project' }
          if ((Get-FileHash $legacyProject -Algorithm SHA256).Hash -ne $legacyBefore) { throw 'Upgrade changed the legacy project' }
          $process = Start-Process "$install/Storynator.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Upgraded executable failed' }
      - name: Publish Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python scripts/make_update_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Update metadata failed' }
          $tag = "v0.8.$env:GITHUB_RUN_NUMBER"
          Get-FileHash dist/Storynator-Setup.exe,dist/Storynator-Portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
          $notes = "Storynator mit integriertem Updater: oben auf das Updatesymbol klicken, GitHub-Version pruefen und Update installieren. Gepruefter Download, Projektsicherung, Aktualisierung der bestehenden Installation ohne Deinstallation und Neustart. Neuinstallieren ueber die vorhandene Version bringt das Updatesymbol auch in aeltere Versionen. Weiterhin enthalten: Storynator 0.8: M19 Featureerweiterung. Vordefinierte und importierbare Projektstarter. Markdown-Quelltext mit Live-Vorschau fuer Manuskript und Richtext-Felder, stabilen Verweisen und eingebetteten Bildern. Lokaler DOCX-Import mit Vorschau, Kapitelaufteilung, Formatierung, Listen, Tabellen und Bildern; Einschraenkungen werden angezeigt. Eigene Sprachwoerterbuecher mit Wortformen, Aussprache, Uebersetzung, CSV/JSON-Austausch und Offline-Rechtschreibung. Zoombare Weltkarten mit verschiebbaren Markierungen, Hover-Vorschau und verknuepften Eintraegen. Speicherung aller Kartenbilder und Woerterbuecher im Projekt. Windows-Tests, Skalierung, EXE und Installation geprueft. Setup ausfuehren, kein Python erforderlich. Weiterhin unsigniert."
          gh release create $tag dist/Storynator-Setup.exe dist/Storynator-Portable.zip dist/SHA256SUMS.txt dist/update.json --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Storynator fuer Windows' --notes $notes --latest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Storynator-Windows-x64
          path: |
            dist/Storynator-Setup.exe
            dist/Storynator-Portable.zip
            dist/SHA256SUMS.txt
            dist/update.json
          retention-days: 14
